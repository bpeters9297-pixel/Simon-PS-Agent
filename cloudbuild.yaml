steps:
  # Deploy to Cloud Run using the pre-built buildpack image
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'simon-ps-consolidator'
      - '--image=us-east5-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/simon-ps-agent/simon-ps-consolidator:$COMMIT_SHA'
      - '--region=us-east4'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=FUNCTION_TARGET=consolidate_ps'
      - '--memory=256Mi'
      - '--timeout=60'
